{% extends "base.html" %}
{% block title %}仪表盘 · 麒麟汇{% endblock %}
{% block content %}
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand">麒麟汇 · 量化交易</span>
    <div class="d-flex align-items-center gap-3">
      <span class="navbar-text text-white">欢迎，{{ username }}</span>
      <a href="/logout" class="btn btn-outline-light btn-sm">退出</a>
    </div>
  </div>
</nav>
<div class="container mt-5">
  <div class="alert alert-warning">
    当前数据仅作演示，重启后注册信息将清空。

    <div class="col-md-6">
      <div class="card text-center shadow-sm h-100">

        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card text-center shadow-sm h-100 border-primary">
        <div class="card-body p-5">
          <h3 class="card-title mb-3">📊 回测结果展示</h3>
          <p class="card-text text-muted">查看 B1 策略回测样例：K 线买卖点、权益曲线、交易明细</p>
          <a href="/backtest" class="btn btn-primary">查看回测 Demo →</a>

      </div>
    </div>
  </div>
