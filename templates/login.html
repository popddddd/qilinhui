{% extends "base.html" %}
{% block title %}登录 · 麒麟汇{% endblock %}
{% block content %}
<div class="container">
  <div class="row justify-content-center" style="margin-top: 10vh;">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="text-center mb-4">麒麟汇 · 登录</h4>
          {% if registered %}
          <div class="alert alert-success">注册成功，请登录</div>
          {% endif %}
          {% if error %}
          <div class="alert alert-danger">用户名或密码错误</div>
          {% endif %}
          <form method="post" action="/login">
            <div class="mb-3">
              <label for="username" class="form-label">用户名</label>
              <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">密码</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="remember" name="remember" value="1">
              <label class="form-check-label" for="remember">记住我（7 天内免登录）</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">登录</button>
          </form>
          <p class="text-center mt-3 mb-0 small">还没有账号？<a href="/register">立即注册</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
